        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(10px); }
            to { opacity: 1; transform: translateY(0); }

        /* Gradient chữ nổi bật */
        .text-gradient {
            background-clip: text;

    <!-- JavaScript Logic -->
    <script>
        document.addEventListener('DOMContentLoaded', () => {
            // --------------------------------------------------------
            // 1. Chức năng Chuyển đổi Dark/Light Mode
            // --------------------------------------------------------
            const htmlElement = document.documentElement;
            const themeToggleBtn = document.getElementById('themeToggle');
            const themeIcon = document.getElementById('themeIcon');
            
            // Kiểm tra trạng thái đã lưu hoặc hệ thống
            if (localStorage.getItem('theme') === 'dark' || (!('theme' in localStorage) && window.matchMedia('(prefers-color-scheme: dark)').matches)) {
                htmlElement.classList.add('dark');
                themeIcon.textContent = 'light_mode';
            } else {
                htmlElement.classList.remove('dark');
                themeIcon.textContent = 'dark_mode';
            }

            themeToggleBtn.addEventListener('click', () => {
                htmlElement.classList.toggle('dark');
                if (htmlElement.classList.contains('dark')) {
                    localStorage.setItem('theme', 'dark');
                    themeIcon.textContent = 'light_mode';
                } else {
                    localStorage.setItem('theme', 'light');
                    themeIcon.textContent = 'dark_mode';
                }
            });

            // --------------------------------------------------------
            // 2. Chức năng Filter (Lọc danh mục)
            // --------------------------------------------------------
            const filterBtns = document.querySelectorAll('.filter-btn');
            const galleryItems = document.querySelectorAll('.masonry-item');

            // Style class tĩnh cho nút Active / Inactive
            const activeClasses = ['bg-gray-900', 'text-white', 'dark:bg-gray-100', 'dark:text-gray-900', 'shadow-md'];
            const inactiveClasses = ['bg-white', 'text-gray-700', 'hover:bg-gray-200', 'dark:bg-gray-800', 'dark:text-gray-300', 'dark:hover:bg-gray-700', 'shadow-sm', 'border', 'border-gray-200', 'dark:border-gray-700'];

            filterBtns.forEach(btn => {
                btn.addEventListener('click', () => {
                    const filterValue = btn.getAttribute('data-filter');

                    // Reset style các nút
                    filterBtns.forEach(b => {
                        b.classList.remove(...activeClasses);
                        b.classList.add(...inactiveClasses);
                    });
                    
                    // Set style nút đang chọn
                    btn.classList.remove(...inactiveClasses);
                    btn.classList.add(...activeClasses);

                    // Lọc Item
                    galleryItems.forEach(item => {
                        if (filterValue === 'all' || item.getAttribute('data-category') === filterValue) {
                            item.classList.remove('hide-item');
                        } else {
                            item.classList.add('hide-item');
                        }
                    });
                });
            });

            // --------------------------------------------------------
            // 3. Hover Video Tự Chạy (Grid)
            // --------------------------------------------------------
            const gridVideos = document.querySelectorAll('.grid-video');
            gridVideos.forEach(video => {
                // Di chuột vào thì play
                video.parentElement.addEventListener('mouseenter', () => {
                    video.play().catch(e => console.log("Lỗi autoplay", e));
                });
                // Rời chuột ra thì dừng
                video.parentElement.addEventListener('mouseleave', () => {
                    video.pause();
                });
            });

            // --------------------------------------------------------
            // 4. Chức năng Lightbox (Xem phóng to)
            // --------------------------------------------------------
            const lightbox = document.getElementById('lightbox');
            const lightboxImg = document.getElementById('lightboxImg');
            const lightboxVideo = document.getElementById('lightboxVideo');
            const closeLightboxBtn = document.getElementById('closeLightbox');

            function openLightbox() {
                lightbox.classList.remove('hidden');
                // Timeout nhỏ để transition opacity hoạt động
                setTimeout(() => {
                    lightbox.classList.remove('opacity-0');
                    lightbox.classList.add('opacity-100');
                }, 10);
                document.body.style.overflow = 'hidden'; // Khóa cuộn trang nền
            }

            function closeLightbox() {
                lightbox.classList.remove('opacity-100');
                lightbox.classList.add('opacity-0');
                setTimeout(() => {
                    lightbox.classList.add('hidden');
                    // Reset nội dung
                    lightboxImg.classList.add('hidden');
                    lightboxVideo.classList.add('hidden');
                    lightboxVideo.pause(); 
                    lightboxVideo.src = "";
                }, 300); // Khớp với duration-300
                document.body.style.overflow = 'auto'; // Mở lại cuộn trang
            }

            // Gắn event click cho các items
            galleryItems.forEach(item => {
                item.addEventListener('click', () => {
                    const imgEl = item.querySelector('img');
                    const vidEl = item.querySelector('video');

                    if (imgEl) {
                        lightboxImg.src = imgEl.src;
                        lightboxImg.classList.remove('hidden');
                    } else if (vidEl) {
                        lightboxVideo.src = vidEl.src;
                        lightboxVideo.classList.remove('hidden');
                        lightboxVideo.play(); // Tự động phát khi mở lightbox (có control)
                    }
                    openLightbox();
                });
            });

            // Đóng bằng nút X
            closeLightboxBtn.addEventListener('click', closeLightbox);

            // Đóng bằng cách click ra ngoài viền
            lightbox.addEventListener('click', (e) => {
                if (e.target === lightbox || e.target.parentElement === lightbox && e.target !== lightboxImg && e.target !== lightboxVideo) {
                    closeLightbox();
                }
            });

            // Đóng bằng nút ESC trên bàn phím
            document.addEventListener('keydown', (e) => {
                if (e.key === 'Escape' && !lightbox.classList.contains('hidden')) {
                    closeLightbox();
                }
            });
        });
    </script>
